name: VMRX transparent PNG artwork normalization
on:
  push:
    branches: [fix/vmrx-branded-daemon-and-block1-sync]
    paths:
      - scripts/transparent_png_logos.py
      - .github/workflows/transparent-logos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transparent-logos:
    if: github.ref == 'refs/heads/fix/vmrx-branded-daemon-and-block1-sync'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG background segmentation dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Normalize full-resolution official VMRX PNG assets
        run: |
          python scripts/transparent_png_logos.py
          git diff --check
      - name: Verify PNG transparency and source dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in [Path('assets/vmrx-logo.png'), *Path('assets/branding').glob('*.png')]:
              with Image.open(path) as img:
                  assert img.format == 'PNG'
                  assert img.mode == 'RGBA'
                  assert img.getpixel((0,0))[3] == 0, (path, 'opaque corner')
                  assert img.getchannel('A').getextrema()[1] > 0, (path, 'all transparent')
                  print(path, img.size, img.getchannel('A').getextrema())
          PY
      - name: Commit cleaned transparent PNGs to the test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/vmrx-logo.png assets/branding/*.png
          if git diff --cached --quiet; then
            echo "No changes: PNGs already normalized"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "fix(branding): remove dark background from original PNG logos"
          git push origin HEAD:fix/vmrx-branded-daemon-and-block1-sync
