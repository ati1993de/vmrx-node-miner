name: Publish verified VMRX Node & Miner v0.1.2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v012.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: vmrx-gui-v012-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ati1993de/vmrx-node-miner
      VMRX_GUI_SOURCE_SHA: a395f8f1dec76a202deb24ce9c05eadb47e60e1a
      VMRX_CORE_SOURCE_SHA: f36808895e2bb9b21f5d2bb776f299773e90a693
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require Core v0.1.2 already officially released
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/ati1993de/vmrx-core/releases/tags/v0.1.2 \
            --jq '.tag_name' | grep -Fxq v0.1.2
          echo 'PASS: verified Core v0.1.2 is publicly released'
      - name: Assert GUI package source matches CI test
        shell: bash
        run: |
          set -euo pipefail
          test -s RELEASE_NOTES_v0.1.2.md
          git cat-file -e "${VMRX_GUI_SOURCE_SHA}^{commit}"
          git diff --exit-code "${VMRX_GUI_SOURCE_SHA}" HEAD -- app.py node_process.py rpc_client.py tests scripts requirements-build.txt assets .github/workflows/build-release.yml
          # Require a complete successful, exact-commit dual-OS GUI workflow run.
          # Do not accept a green result for older GUI source or a previous Core pin.
          run_id="$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${VMRX_GUI_SOURCE_SHA}&per_page=100" |
            jq -r --arg sha "${VMRX_GUI_SOURCE_SHA}" '[.workflow_runs[] | select(.head_sha == $sha and .name == "VMRX Node & Miner — integrated Windows Core and Linux GUI" and .status == "completed" and .conclusion == "success") | .id] | first // empty')"
          test -n "${run_id}" || { echo "No green GUI CI for exact ${VMRX_GUI_SOURCE_SHA}"; exit 1; }
          echo "GUI_RUN_ID=${run_id}" >> "${GITHUB_ENV}"
          echo "PASS: exact GUI CI ${run_id} succeeded on Linux and Windows"
          grep -Fq "ref: ${VMRX_CORE_SOURCE_SHA}" .github/workflows/build-release.yml

      - name: Download tested native GUI+Core Windows and Linux GUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/windows stage/linux release
          gh run download "${GUI_RUN_ID}" -R "${GH_REPO}" --name vmrx-gui-Windows --dir stage/windows
          gh run download "${GUI_RUN_ID}" -R "${GH_REPO}" --name vmrx-gui-Linux --dir stage/linux
          win='stage/windows/VMRX-Node-Miner-windows-x64.zip'
          linux='stage/linux/VMRX-Node-Miner-linux-x86_64.tar.gz'
          test -s "${win}" && test -s "${linux}"
          unzip -t "${win}"
          unzip -Z1 "${win}" | grep -Eq '^VMRX-Node-Miner\.exe$'
          unzip -Z1 "${win}" | grep -Eq '^core/vmrxd\.exe$'
          unzip -Z1 "${win}" | grep -Eq '^core/vmrx\.ico$'
          unzip -Z1 "${win}" | grep -Eq '^core/CORE-SOURCE\.txt$'
          unzip -p "${win}" core/CORE-SOURCE.txt | grep -Fq "${VMRX_CORE_SOURCE_SHA}"
          unzip -p "${win}" README-WINDOWS.txt | grep -Fq 'v0.1.2'
          tar -tzf "${linux}" | grep -q '^VMRX-Node-Miner$'
          cp "${win}" release/
          cp "${linux}" release/

      - name: Require a new tag and compute release checksums
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.2 -R "${GH_REPO}" >/dev/null 2>&1 || gh api "repos/${GH_REPO}/git/ref/tags/v0.1.2" >/dev/null 2>&1; then
            echo 'v0.1.2 already exists - refusing replacement'; exit 1
          fi
          (cd release && sha256sum VMRX-Node-Miner-* > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Publish new verified integrated release v0.1.2
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.2 \
            release/VMRX-Node-Miner-windows-x64.zip \
            release/VMRX-Node-Miner-linux-x86_64.tar.gz \
            release/SHA256SUMS \
            --target "${GITHUB_SHA}" -R "${GH_REPO}" --latest \
            --title 'VMRX Node & Miner v0.1.2 — Windows (Core included) + Linux' \
            --notes-file RELEASE_NOTES_v0.1.2.md
          gh release view v0.1.2 -R "${GH_REPO}"
