name: VMRX Wallet beta - Python, UI and RPC adapter checks

on:
  push:
    branches: [feature/wallet-recovery-beta-20261025]
    paths:
      - 'app.py'
      - 'wallet_*.py'
      - 'rpc_client.py'
      - 'node_process.py'
      - 'tests/**'
      - 'requirements-build.txt'
      - '.github/workflows/wallet-beta-checks.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'wallet_*.py'
      - 'rpc_client.py'
      - 'node_process.py'
      - 'tests/**'
      - 'requirements-build.txt'
      - '.github/workflows/wallet-beta-checks.yml'

permissions:
  contents: read

jobs:
  wallet-unit:
    name: Wallet adapter and existing GUI unit tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested GUI and wallet runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Python compile and unit tests
        shell: bash
        run: |
          python -m compileall -q app.py wallet_backend.py wallet_ui.py node_process.py rpc_client.py tests
          python -m unittest discover -s tests -v

  linux-ui-smoke:
    name: Start/stop actual Tk app without wallet engine
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install runtime dependencies for Tk wallet
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Tk window smoke check in virtual display
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a timeout 30s python - <<'PY'
          from app import App
          window = App()
          assert any("Wallet" in window.tabs.tab(t, "text") for t in window.tabs.tabs())
          assert window.wallet_panel.service.child is None
          window.after(1500, window._close)
          window.mainloop()
          print("PASS: GUI wallet tab loads and cleanly closes without launching wallet engine")
          PY

  release-readiness:
    name: Native wallet binary / actual recovery acceptance gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Surface outstanding release blockers (do not mark as tested)
        run: |
          echo "::warning::GUI wallet adapter tests are NOT a native VMRX wallet engine integration test."
          echo "::warning::Official Core v0.1.3 release does NOT bundle vmrx-wallet-rpc/monero-wallet-rpc."
          echo "::warning::Core PR #6 confirms native Windows/Linux create/restore identity; packaged GUI+wallet RPC and real funded send/receive are NOT yet tested."
          echo "Release readiness: BLOCKED pending wallet binary packaging, end-to-end GUI smoke, and real funded spend/recover validation."
