name: VMRX Node & Miner — integrated Windows Core and Linux GUI

on:
  workflow_dispatch:
  push:
    branches: [main, fix/vmrx-branded-daemon-and-block1-sync]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  gui:
    name: GUI + platform package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout GUI
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate official branding and version
        shell: bash
        run: |
          test -s assets/vmrx-logo.png
          ! test -f assets/vmrx-draft.png
          grep -q 'v0.1.2' app.py

      - name: Linux Tk GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev libx11-6

      - name: Install GUI build requirements
        run: python -m pip install -r requirements-build.txt

      - name: GUI unit tests
        run: python -m unittest discover -s tests -v

      - name: Linux desktop GUI binary
        if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh

      - name: Package Linux GUI (requires separate Linux Core)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          tar -czf release/VMRX-Node-Miner-linux-x86_64.tar.gz -C dist VMRX-Node-Miner

      - name: Windows desktop GUI binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1

      # Build VMRX from its OWN source, never a downloaded Monero executable.
      # Ref is deliberately fixed so the GUI release has auditable core provenance.
      - name: Checkout actual VMRX Core source and submodules
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: ati1993de/vmrx-core
          ref: f36808895e2bb9b21f5d2bb776f299773e90a693
          path: vmrx-core
          submodules: recursive
          persist-credentials: false

      - name: Install Windows x64 Core toolchain (MSYS2 MinGW64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            file
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-unbound
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-pkgconf

      - name: Install pinned MSYS2 HIDAPI/libusb packages from official mirror
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p msys2-deps
          curl --fail --location --retry 3 --output msys2-deps/hidapi.pkg.tar.zst https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-hidapi-0.15.0-2-any.pkg.tar.zst
          curl --fail --location --retry 3 --output msys2-deps/libusb.pkg.tar.zst https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-libusb-1.0.30-1-any.pkg.tar.zst
          printf '%s  %s\n' '89fb61549a437d65076a092a367fcb264fc7045ee9ebef48cd81f5a76a5588f8' 'msys2-deps/hidapi.pkg.tar.zst' '124edc26b009678a4c5e759481a364abf63ed7f2f49a53092e8bd0a47c0c0740' 'msys2-deps/libusb.pkg.tar.zst' | sha256sum -c -
          pacman --noconfirm -U msys2-deps/hidapi.pkg.tar.zst msys2-deps/libusb.pkg.tar.zst

      - name: Verify VMRX fork mainnet constants
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          grep -Eq 'CRYPTONOTE_NAME[[:space:]]+"vmrx"' vmrx-core/src/cryptonote_config.h
          grep -Eq 'DIFFICULTY_TARGET_V2[[:space:]]+120' vmrx-core/src/cryptonote_config.h
          grep -Eq 'CRYPTONOTE_MINED_MONEY_UNLOCK_WINDOW[[:space:]]+60' vmrx-core/src/cryptonote_config.h

      - name: Build official transparent VMRX Windows Core icon
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: vmrx-core
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/build_windows_icon.py
          if (-not (Test-Path 'assets/vmrx.ico')) { throw 'Official VMRX Core icon missing' }

      - name: Compile native Windows VMRX daemon (not Monero)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: vmrx-core
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -euo pipefail
          make release-static-win64-daemon -j2

      - name: Bundle Windows core executable and required MinGW DLLs
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p release-bundle/core
          binary="$(find vmrx-core/build -type f -name vmrxd.exe -print -quit)"
          test -n "$binary" && test -s "$binary" || { echo 'VMRX Windows daemon build missing'; exit 1; }
          file "$binary" | grep -q 'PE32+'
          objdump -h "$binary" | grep -Eq '[[:space:]]\.rsrc[[:space:]]' || { echo 'VMRX Core PE resources missing'; exit 1; }
          test -s vmrx-core/assets/vmrx.ico
          cp "$binary" release-bundle/core/vmrxd.exe
          cp vmrx-core/assets/vmrx.ico release-bundle/core/vmrx.ico
          pending=(release-bundle/core/vmrxd.exe)
          while [ "${#pending[@]}" -gt 0 ]; do
            current="${pending[0]}"
            pending=("${pending[@]:1}")
            while IFS= read -r dll; do
              [ -n "$dll" ] || continue
              if [ -f "/mingw64/bin/$dll" ] && [ ! -f "release-bundle/core/$dll" ]; then
                cp "/mingw64/bin/$dll" "release-bundle/core/$dll"
                pending+=("release-bundle/core/$dll")
              fi
            done < <(objdump -p "$current" 2>/dev/null | sed -n 's/^[[:space:]]*DLL Name:[[:space:]]*//p')
          done
          cp vmrx-core/LICENSE release-bundle/core/CORE-LICENSE.txt
          cp vmrx-core/docs/RELEASE_STATUS.md release-bundle/core/CORE-RELEASE-STATUS.md
          printf '%s\n' 'VMRX Core source: ati1993de/vmrx-core' 'Commit: f36808895e2bb9b21f5d2bb776f299773e90a693' > release-bundle/core/CORE-SOURCE.txt
          test -s release-bundle/core/vmrxd.exe
          test -s release-bundle/core/vmrx.ico

      - name: Windows mainnet genesis smoke test (must pass to release)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $daemon = Join-Path $PWD 'release-bundle/core/vmrxd.exe'
          $dataDir = Join-Path $env:RUNNER_TEMP 'vmrx-integrated-windows-smoke'
          $logFile = Join-Path $dataDir 'smoke.log'
          $stdoutFile = Join-Path $dataDir 'stdout.txt'
          $stderrFile = Join-Path $dataDir 'stderr.txt'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $params = @(
            '--non-interactive', '--offline',
            '--data-dir', $dataDir,
            '--p2p-bind-ip', '127.0.0.1', '--p2p-bind-port', '29780',
            '--rpc-bind-ip', '127.0.0.1', '--rpc-bind-port', '29781',
            '--no-zmq', '--no-igd', '--disable-dns-checkpoints',
            '--check-updates', 'disabled',
            '--log-file', $logFile
          )
          $process = $null
          $passed = $false
          $lastRpcError = ''
          try {
            Write-Host "VMRX: starting compiled Windows executable from pinned fork source"
            Write-Host "Daemon path: $daemon"
            Write-Host "Working dir: $(Split-Path $daemon)"
            $process = Start-Process -FilePath $daemon -ArgumentList $params -WorkingDirectory (Split-Path $daemon) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
            $info = $null
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw "VMRX daemon exited before RPC: $($process.ExitCode)" }
              try {
                $info = Invoke-RestMethod -Uri 'http://127.0.0.1:29781/get_info' -TimeoutSec 3
                if ($info.height -ge 1) { break }
              } catch {
                $lastRpcError = $_.Exception.Message
              }
            }
            if ($null -eq $info -or $info.height -lt 1) {
              throw "VMRX daemon did not start local RPC; last error: $lastRpcError"
            }
            Write-Host "RPC get_info height: $($info.height) — network: $($info.nettype)"
            $body = @{jsonrpc='2.0'; id='0'; method='get_block_header_by_height'; params=@{height=0}} | ConvertTo-Json -Depth 5
            $result = Invoke-RestMethod -Uri 'http://127.0.0.1:29781/json_rpc' -Method POST -ContentType 'application/json' -Body $body -TimeoutSec 10
            if ($result.error) { throw "RPC returned error: $($result.error | ConvertTo-Json -Depth 4 -Compress)" }
            $expected = '405baab8805904ffb7d3643a5004c43b45fc3f5f4c97e712ba4c078a384139d4'
            $actual = [string]$result.result.block_header.hash
            Write-Host "Expected genesis: $expected"
            Write-Host "Observed genesis: $actual"
            if ($actual -ne $expected) { throw "WRONG GENESIS: $actual (expected $expected)" }
            $passed = $true
            Write-Host "PASS: Native VMRX Windows Core running with correct genesis $actual"
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (-not $passed) {
              Write-Host '=== Failed Windows VMRX smoke test: daemon diagnostics ==='
              if (Test-Path $logFile) { Get-Content $logFile -Tail 100 -ErrorAction SilentlyContinue }
              if (Test-Path $stderrFile) { Get-Content $stderrFile -Tail 60 -ErrorAction SilentlyContinue }
              if (Test-Path $stdoutFile) { Get-Content $stdoutFile -Tail 60 -ErrorAction SilentlyContinue }
            }
          }

      - name: Upload diagnostics when Windows daemon smoke test fails
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vmrx-windows-smoke-diagnostics
          path: ${{ runner.temp }}/vmrx-integrated-windows-smoke/*.txt
          if-no-files-found: ignore
          retention-days: 7

      # Unlike the genesis-only check, this exercises the actual mainnet
      # protocol, coinbase reward validation and PoW for the first mined block.
      # This must stay a failing gate until genuine chain compatibility works.
      - name: Sync through the live VMRX mainnet tip and verify historical block 1
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = "Stop"
          $daemon = Join-Path $PWD "release-bundle/core/vmrxd.exe"
          $dataDir = Join-Path $env:RUNNER_TEMP "vmrx-windows-block1-sync"
          $logFile = Join-Path $dataDir "vmrx-sync.log"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path "buildlogs" | Out-Null
          $arguments = @(
            "--non-interactive",
            "--data-dir", $dataDir,
            "--p2p-bind-ip", "127.0.0.1", "--p2p-bind-port", "29880",
            "--rpc-bind-ip", "127.0.0.1", "--rpc-bind-port", "29881",
            "--no-zmq", "--no-igd", "--disable-dns-checkpoints",
            "--check-updates", "disabled",
            "--add-exclusive-node", "31.70.81.5:29780",
            "--log-level", "2", "--log-file", $logFile
          )
          $process = $null
          $passed = $false
          $lastError = ""
          try {
            $process = Start-Process -FilePath $daemon -ArgumentList $arguments -WorkingDirectory (Split-Path $daemon) -PassThru -WindowStyle Hidden
            for ($i = 0; $i -lt 220; $i++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) { throw "VMRX daemon exited with $($process.ExitCode) before syncing" }
              try {
                $info = Invoke-RestMethod -Uri "http://127.0.0.1:29881/get_info" -TimeoutSec 3
                $npeers = [int]$info.incoming_connections_count + [int]$info.outgoing_connections_count
                if ($info.height -ge 1194 -and $info.synchronized -and $npeers -ge 1) {
                  $body = @{jsonrpc="2.0";id="1";method="get_block_header_by_height";params=@{height=1}} | ConvertTo-Json -Depth 4
                  $res = Invoke-RestMethod -Uri "http://127.0.0.1:29881/json_rpc" -Method POST -ContentType "application/json" -Body $body -TimeoutSec 5
                  $h = $res.result.block_header
                  if ([string]$h.hash -ne "79030889ec6dd46cf2722defe9523bd38d2379168a27935fa3f1cdfe9397e293") { throw "Wrong network: mainnet block 1 hash $($h.hash)" }
                  if ([string]$h.miner_tx_hash -ne "d7f9691cb7c478fd87957e2210df12205399968e394e1d2a3e58ae56fb7b4645") { throw "Wrong block-1 miner transaction hash $($h.miner_tx_hash)" }
                  if ([decimal]$h.reward -ne [decimal]200035184304979968) { throw "Wrong block-1 reward $($h.reward)" }
                  $anchors = @(
                    @{height=0; hash="405baab8805904ffb7d3643a5004c43b45fc3f5f4c97e712ba4c078a384139d4"},
                    @{height=2; hash="85089d1458e2e6f81673ae24dfee40651b375091f9b9c200ecca66b53fda8675"},
                    @{height=10; hash="ca1253c7cd24f355ecc9b7163764205388281ac0a9ee15c4c2f502df7c0adbba"},
                    @{height=100; hash="ba4662de0e2e4a16618b5a0fd2ae691297fe3f205491ef2e6b0e6112ce3cf85d"},
                    @{height=1193; hash="47e0b825d24cf99042fcaf31fb721a2b593d2c3b5e902c6f1e8dd063ed75e591"}
                  )
                  foreach ($anchor in $anchors) {
                    $anchorRequest = @{jsonrpc="2.0";id="anchor";method="get_block_header_by_height";params=@{height=$anchor.height}} | ConvertTo-Json -Depth 5
                    $response = Invoke-RestMethod -Uri "http://127.0.0.1:29881/json_rpc" -Method POST -ContentType "application/json" -Body $anchorRequest -TimeoutSec 5
                    if ([string]$response.result.block_header.hash -ne [string]$anchor.hash) {
                      throw "Wrong VMRX historic chain hash at height $($anchor.height): $($response.result.block_header.hash)"
                    }
                  }
                  Write-Host "PASS: GUI-bundled Windows VMRX Core synced through 1193, all six historical hashes match; height=$($info.height), peers=$npeers"
                  $passed = $true
                  break
                }
              } catch {
                $lastError = $_.Exception.Message
                # A genuine mismatching block is fatal, not an RPC readiness issue.
                if ($lastError -match "Wrong network|Wrong block-1|Wrong block-1 reward|Wrong VMRX historic") { throw }
              }
            }
            if (-not $passed) {
              throw "VMRX Windows sync failed to accept block 1. Last RPC error: $lastError"
            }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $logFile) {
              Copy-Item $logFile "buildlogs/windows-height1-sync.log" -Force
              if (-not $passed) {
                Write-Host "=== Windows chain-acceptance diagnostics (last 180 lines) ==="
                Get-Content $logFile -Tail 180 -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Archive Windows height-1 synchronization diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vmrx-windows-block1-sync-diagnostics
          path: buildlogs/windows-height1-sync.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Package verified Windows GUI + full core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item 'dist/VMRX-Node-Miner.exe' 'release-bundle/VMRX-Node-Miner.exe'
          Copy-Item 'README-WINDOWS-v0.1.2.txt' 'release-bundle/README-WINDOWS.txt'
          if (!(Test-Path 'release-bundle/core/vmrxd.exe')) { throw 'No Windows Core: refusing to release GUI-only archive' }
          if (!(Test-Path 'release-bundle/core/vmrx.ico')) { throw 'No VMRX Core icon: refusing incomplete archive' }
          if (!(Test-Path 'release-bundle/core/CORE-SOURCE.txt')) { throw 'No pinned Core provenance' }
          Compress-Archive -Path 'release-bundle/*' -DestinationPath 'release/VMRX-Node-Miner-windows-x64.zip' -CompressionLevel Optimal -Force
          if ((Get-Item 'release/VMRX-Node-Miner-windows-x64.zip').Length -lt 20000000) {
            throw 'Windows package unexpectedly small; refusing incomplete release'
          }

      - name: Smoke-test the actual extracted Windows ZIP including GUI startup and Core files
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'release/VMRX-Node-Miner-windows-x64.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'vmrx-v012-unpacked-test'
          Expand-Archive -Path $archive -DestinationPath $dest -Force
          $gui = Join-Path $dest 'VMRX-Node-Miner.exe'
          $core = Join-Path $dest 'core/vmrxd.exe'
          $ico = Join-Path $dest 'core/vmrx.ico'
          foreach ($path in @($gui, $core, $ico)) {
            if (!(Test-Path $path -PathType Leaf)) { throw "Incomplete extracted Windows release ZIP: $path" }
          }
          $reported = (& $core --version | Out-String)
          if ($reported -notmatch 'VMRX Core v0.1.2') { throw "Bundled Core reports wrong version: $reported" }
          # The GUI is a windowed executable: a short live process test catches
          # missing DLL/assets/PyInstaller runtime errors. This is not a pixel UI
          # audit or evidence of real mining payouts.
          $p = $null
          try {
            $p = Start-Process -FilePath $gui -WorkingDirectory $dest -PassThru
            Start-Sleep -Seconds 7
            $p.Refresh()
            if ($p.HasExited) { throw "GUI terminated on startup with exit code $($p.ExitCode)" }
            Write-Host "PASS: Extracted VMRX GUI executable starts; bundled vmrxd.exe reports v0.1.2 with native ICO"
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload platform preview packages
        uses: actions/upload-artifact@v4
        with:
          name: vmrx-gui-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: gui
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vmrx-gui-*
          path: release
          merge-multiple: true
      - name: Require actual Windows core package and release notes
        shell: bash
        run: |
          set -euo pipefail
          test -s "RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          test -s release/VMRX-Node-Miner-windows-x64.zip
          test -s release/VMRX-Node-Miner-linux-x86_64.tar.gz
          unzip -Z1 release/VMRX-Node-Miner-windows-x64.zip | grep -Eq '^core/vmrxd\.exe$'
          unzip -Z1 release/VMRX-Node-Miner-windows-x64.zip | grep -Eq '^core/vmrx\.ico$'
          unzip -Z1 release/VMRX-Node-Miner-windows-x64.zip | grep -Eq '^core/CORE-SOURCE\.txt$'
      - name: Write checksums
        shell: bash
        run: |
          cd release
          sha256sum VMRX-Node-Miner-* > SHA256SUMS
      - name: Publish integrated Windows node + Linux GUI release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --latest \
            --title "VMRX Node & Miner ${GITHUB_REF_NAME} — Windows (Core included) & Linux GUI" \
            --notes-file "RELEASE_NOTES_${GITHUB_REF_NAME}.md"
